# Packages zkas-mobile for both platforms.
#
# This is CI rather than a local script because neither artifact can be produced
# on the build box: an XCFramework needs Xcode, which needs macOS, and the Android
# NDK is preinstalled on GitHub's ubuntu runners but not on ours.
name: mobile

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", "src/**", ".github/workflows/mobile.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path mobile/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Build the JNI libraries
        working-directory: mobile
        # The NDK is preinstalled on this runner image; cargo-ndk finds it via
        # ANDROID_NDK_LATEST_HOME and sets the linkers per ABI.
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ./jniLibs build --release
      - name: Generate the Kotlin bindings
        working-directory: mobile
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen -- generate \
            --library target/release/libzkas_mobile.so \
            --language kotlin --out-dir ./kotlin
      - name: What came out
        working-directory: mobile
        run: find jniLibs kotlin -type f | sed 's/^/  /' && du -sh jniLibs
      - uses: actions/upload-artifact@v4
        with:
          name: zkas-mobile-android
          path: |
            mobile/jniLibs/**
            mobile/kotlin/**

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build the static libraries
        working-directory: mobile
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
      - name: Generate the Swift bindings
        working-directory: mobile
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen -- generate \
            --library target/release/libzkas_mobile.dylib \
            --language swift --out-dir ./swift
      - name: Assemble the XCFramework
        working-directory: mobile
        # One slice per platform. Device and simulator cannot share a slice, and
        # the two simulator architectures must be lipo'd into one before they can.
        run: |
          mkdir -p headers sim
          cp swift/zkas_mobileFFI.h headers/
          cp swift/zkas_mobileFFI.modulemap headers/module.modulemap
          lipo -create \
            target/aarch64-apple-ios-sim/release/libzkas_mobile.a \
            target/x86_64-apple-ios/release/libzkas_mobile.a \
            -output sim/libzkas_mobile.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libzkas_mobile.a -headers headers \
            -library sim/libzkas_mobile.a -headers headers \
            -output ZkasMobile.xcframework
      - name: What came out
        working-directory: mobile
        run: find ZkasMobile.xcframework -maxdepth 2 | sed 's/^/  /' && du -sh ZkasMobile.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: zkas-mobile-ios
          path: |
            mobile/ZkasMobile.xcframework/**
            mobile/swift/zkas_mobile.swift
