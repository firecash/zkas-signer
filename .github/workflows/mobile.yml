# Packages zkas-mobile for both platforms.
#
# This is CI rather than a local script because neither artifact can be produced
# on the build box: an XCFramework needs Xcode, which needs macOS, and the Android
# NDK is preinstalled on GitHub's ubuntu runners but not on ours.
name: mobile

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag, GitHub release, Maven, SwiftPM)"
        type: boolean
        default: false
      version:
        description: "Version to publish, e.g. 0.1.0"
        default: "0.1.0"
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", "src/**", ".github/workflows/mobile.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path mobile/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Build the JNI libraries
        working-directory: mobile
        # The NDK is preinstalled on this runner image; cargo-ndk finds it via
        # ANDROID_NDK_LATEST_HOME and sets the linkers per ABI.
        run: |
          # x86_64 is back: kaspa-hashes/build.rs now honours its own `no-asm`
          # feature, which this crate requests for mobile, so the Intel emulator
          # builds instead of panicking in the build script.
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ./jniLibs build --release
      - name: Keep only the library that is actually loaded
        working-directory: mobile
        # cargo-ndk copies EVERY cdylib the build produced, and firecash-signer and
        # the workflow-* crates all declare one — so the .aar was carrying twelve
        # extra .so files, 57% of its native payload, that nothing ever opens.
        # UniFFI's Kotlin loads exactly `zkas_mobile`.
        run: |
          find jniLibs -name '*.so' ! -name 'libzkas_mobile.so' -print -delete | sed 's/^/  dropped /'
          echo "kept:"; find jniLibs -name '*.so' | sed 's/^/  /'

      - name: Generate the Kotlin bindings
        working-directory: mobile
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen -- generate \
            --library target/release/libzkas_mobile.so \
            --language kotlin --out-dir ./kotlin
      - name: Assemble the AAR
        working-directory: mobile
        run: |
          mkdir -p android/src/main/jniLibs android/src/main/java
          cp -r jniLibs/* android/src/main/jniLibs/
          cp -r kotlin/* android/src/main/java/
          cd android && gradle --no-daemon assembleRelease
      - name: What came out
        working-directory: mobile
        run: |
          find jniLibs -type f | sed 's/^/  /'
          find android/build/outputs/aar -type f | sed 's/^/  /'
          du -sh android/build/outputs/aar/*.aar
      - uses: actions/upload-artifact@v4
        with:
          name: zkas-mobile-android
          path: |
            mobile/android/build/outputs/aar/*.aar
            mobile/jniLibs/**
            mobile/kotlin/**

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the node workspace this crate builds against
        run: git clone --depth 1 https://github.com/firecash/zkas-rusty.git ../rusty-kaspa
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build the static libraries
        working-directory: mobile
        run: |
          # Device, plus both simulator architectures now that the build-script
          # panic is fixed upstream.
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
      - name: Generate the Swift bindings
        working-directory: mobile
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen -- generate \
            --library target/release/libzkas_mobile.dylib \
            --language swift --out-dir ./swift
      - name: Assemble the XCFramework
        working-directory: mobile
        # One slice per platform. Device and simulator cannot share a slice, and
        # the two simulator architectures must be lipo'd into one before they can.
        run: |
          mkdir -p headers
          cp swift/zkas_mobileFFI.h headers/
          cp swift/zkas_mobileFFI.modulemap headers/module.modulemap
          # Device and simulator cannot share an xcframework slice, and the two
          # simulator architectures must be lipo'd into one before they can.
          mkdir -p sim
          lipo -create \
            target/aarch64-apple-ios-sim/release/libzkas_mobile.a \
            target/x86_64-apple-ios/release/libzkas_mobile.a \
            -output sim/libzkas_mobile.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libzkas_mobile.a -headers headers \
            -library sim/libzkas_mobile.a -headers headers \
            -output ZkasMobile.xcframework
      - name: What came out
        working-directory: mobile
        run: find ZkasMobile.xcframework -maxdepth 2 | sed 's/^/  /' && du -sh ZkasMobile.xcframework
      - name: Lay out the Swift package
        working-directory: mobile
        run: |
          mkdir -p package/Sources/ZkasMobile
          cp -r ZkasMobile.xcframework package/
          cp swift/zkas_mobile.swift package/Sources/ZkasMobile/
          cp packaging/Package.swift.template package/Package.swift
          # The checksum a remote .binaryTarget needs, printed where a human will
          # see it rather than left for someone to compute later.
          zip -qr ZkasMobile.xcframework.zip ZkasMobile.xcframework
          echo "xcframework zip sha256: $(swift package compute-checksum ZkasMobile.xcframework.zip 2>/dev/null || shasum -a 256 ZkasMobile.xcframework.zip | cut -d" " -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: zkas-mobile-ios
          path: |
            mobile/package/**
            mobile/ZkasMobile.xcframework.zip

  # Turns the artifacts above into something consumers can actually depend on:
  # a Maven coordinate and a Swift package pinned to a tag.
  publish:
    if: inputs.publish
    needs: [test, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { name: zkas-mobile-android, path: android-art }
      - uses: actions/download-artifact@v4
        with: { name: zkas-mobile-ios, path: ios-art }

      - name: Point Package.swift at this release
        id: swift
        run: |
          VERSION="${{ inputs.version }}"
          ZIP=$(find ios-art -name "ZkasMobile.xcframework.zip" | head -1)
          SUM=$(shasum -a 256 "$ZIP" | cut -d" " -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/mobile-v$VERSION/ZkasMobile.xcframework.zip"
          # The Swift source lives in the repo; only the binary comes from the
          # release, so both have to be committed before the tag is cut.
          mkdir -p Sources/ZkasMobile
          cp "$(find ios-art -name 'zkas_mobile.swift' | head -1)" Sources/ZkasMobile/
          python3 - "$URL" "$SUM" <<'PY'
          import re, sys, pathlib
          url, checksum = sys.argv[1], sys.argv[2]
          p = pathlib.Path("Package.swift"); s = p.read_text()
          s = re.sub(r'url: "[^"]*"', f'url: "{url}"', s)
          s = re.sub(r'checksum: "[^"]*"', f'checksum: "{checksum}"', s)
          p.write_text(s)
          PY
          echo "checksum=$SUM" >> $GITHUB_OUTPUT
          echo "  xcframework sha256: $SUM"

      - name: Commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name firecash
          git config user.email dev@firecash.info
          git add Package.swift Sources/ZkasMobile
          git commit -m "mobile $VERSION: Swift package pinned to the released XCFramework" || echo "nothing to commit"
          git push origin main
          git tag -f "mobile-v$VERSION"
          git push -f origin "mobile-v$VERSION"

      - name: GitHub release with the artifacts
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          VERSION="${{ inputs.version }}"
          gh release create "mobile-v$VERSION" --title "zkas-mobile $VERSION" --notes \
            "Native ZKas key custody and payment authorization.

          **Swift** — add https://github.com/${{ github.repository }} at \`mobile-v$VERSION\`.
          **Android** — \`info.zkas:zkas-mobile:$VERSION\` from GitHub Packages.

          Wraps the same crate the ZKas wallet signs with. Proving stays on the daemon; this device verifies the prepared bundle and signs. No blind-signing call is exposed." \
            || gh release edit "mobile-v$VERSION" --title "zkas-mobile $VERSION"
          gh release upload "mobile-v$VERSION" \
            "$(find ios-art -name 'ZkasMobile.xcframework.zip' | head -1)" \
            $(find android-art -name '*.aar' | head -1) --clobber

      - name: Publish the AAR to GitHub Packages
        working-directory: mobile/android
        env:
          GITHUB_ACTOR: "${{ github.actor }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          mkdir -p src/main/jniLibs src/main/java
          cp -r ../../android-art/jniLibs/* src/main/jniLibs/ 2>/dev/null || true
          cp -r ../../android-art/kotlin/* src/main/java/ 2>/dev/null || true
          gradle --no-daemon -PlibVersion=${{ inputs.version }} publishReleasePublicationToGitHubPackagesRepository
