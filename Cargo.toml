[package]
name = "firecash-signer"
version = "0.1.0"
edition = "2021"
description = "WASM Orchard key primitives for ZKas: seed -> zkas: address, message sign/verify. No proving circuit — keys and signatures only, so it stays small and runs in a browser."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# shielded-core WITHOUT the `circuit` feature: key derivation, address, and
# RedPallas message signing only — no halo2 proving, so this stays WASM-small.
kaspa-shielded-core = { path = "../rusty-kaspa/shielded-core", default-features = false }
kaspa-addresses = { path = "../rusty-kaspa/crypto/addresses" }
zkas-signer = { path = "../rusty-kaspa/sdk/signer" }
wasm-bindgen = "0.2"
rand = "0.10"
hex = "0.4"
# Must be the SAME crate shielded-core uses (zakura-orchard since d749389), or
# `SpendingKey` here and there are two unrelated types.
orchard = { package = "zakura-orchard", version = "1.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recovery phrases. BIP-39 for the wordlist/checksum (the scheme every wallet and
# hardware device already speaks) and ZIP-32 for shielded HD derivation, which is
# what Zcash's own wallets use for Orchard. Both are the mature, widely-audited
# implementations; `orchard` already depends on zip32 internally.
bip39 = { version = "2", default-features = false, features = ["std"] }
zip32 = { version = "0.2", default-features = false }
# Force getrandom's browser backend on wasm so `rand::rng()` works in-page. A no-op on
# native targets, which use the OS CSPRNG regardless. rand 0.10 sits on getrandom 0.4,
# whose wasm backend is opt-in twice: this feature AND the
# `--cfg getrandom_backend="wasm_js"` rustflag in .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
