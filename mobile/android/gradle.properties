# The instrumentation tests pull androidx.test, and AGP refuses AndroidX on the
# classpath unless this is set — the emulator booted and then the build failed
# before a single test ran.
android.useAndroidX=true
# The emulator, Gradle and the Kotlin compiler share a CI runner; the default
# heap is not enough for all three.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
