[package]
name = "zkas-mobile"
version = "0.1.0"
edition = "2021"
description = "ZKas key custody and payment authorization for iOS and Android. Swift and Kotlin bindings over the exact crate the ZKas wallet signs with."
license = "MIT OR Apache-2.0"

[workspace]

[lib]
# `cdylib` for Android's JNI loader, `staticlib` for an iOS XCFramework, `lib` so
# the Rust tests can link it.
crate-type = ["cdylib", "staticlib", "lib"]
name = "zkas_mobile"

[dependencies]
# THE SAME CRATE THE WALLET SIGNS WITH. Not a reimplementation: a second
# implementation of key derivation is a second chance to derive an address nobody
# can spend from. Its `#[wasm_bindgen]` attributes are inert on native targets.
firecash-signer = { path = ".." }
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
zeroize = { version = "1", features = ["alloc"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# blake3 arrives through kaspa-hashes and compiles C/SIMD by default, which is
# what fails a mobile build — under cargo-ndk and under the iOS SDK alike. It
# ships a pure-Rust backend, and cargo features are additive across the graph, so
# asking for it HERE turns it on for the whole mobile build without touching the
# node repo. Scoped to mobile because `pure` trades assembly for portable Rust:
# right for a phone doing a few hashes per signature, wrong for a node.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
# Same reason as blake3 above: kaspa-hashes hand-writes keccak assembly for x86_64
# and has none for android or ios, so the Intel emulator and the Intel Mac
# simulator need its pure-Rust path. Requesting the feature here turns it on for
# the mobile build; on arm64 the assembly is never reached anyway.
kaspa-hashes = { path = "../../rusty-kaspa/crypto/hashes", features = ["no-asm"] }
